<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500 Words Daily</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --paper: #ffffff;
  --paper-raised: #ffffff;
  --paper-line: #dcdedb;
  --ink: #1b1f1c;
  --ink-soft: #6b7069;
  --ink-faint: #9aa09a;
  --accent: #1f8a5c;
  --accent-ink: #ffffff;
  --accent-soft: #e8f5ee;
  --flame: #2f9e63;
  --flame-soft: #e8f5ee;
  --danger: #b3402c;
  --shadow: rgba(20, 24, 21, 0.06);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #101312;
    --paper-raised: #171b19;
    --paper-line: #2b302c;
    --ink: #eef1ed;
    --ink-soft: #9ba39c;
    --ink-faint: #626962;
    --accent: #45b57e;
    --accent-ink: #08120d;
    --accent-soft: #17281f;
    --flame: #52c98c;
    --flame-soft: #17281f;
    --danger: #d97a63;
    --shadow: rgba(0, 0, 0, 0.4);
  }
}
:root[data-theme="dark"] {
  --paper: #101312;
  --paper-raised: #171b19;
  --paper-line: #2b302c;
  --ink: #eef1ed;
  --ink-soft: #9ba39c;
  --ink-faint: #626962;
  --accent: #45b57e;
  --accent-ink: #08120d;
  --accent-soft: #17281f;
  --flame: #52c98c;
  --flame-soft: #17281f;
  --danger: #d97a63;
  --shadow: rgba(0, 0, 0, 0.4);
}

* { box-sizing: border-box; }

html, body {
  background: var(--paper);
  color: var(--ink);
  height: 100%;
  overflow: hidden;
  margin: 0;
}

body {
  font-family: 'Public Sans', ui-sans-serif, system-ui, sans-serif;
}

[hidden] { display: none !important; }

.no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
.no-scrollbar::-webkit-scrollbar { width: 0; height: 0; display: none; }

.wrap {
  max-width: 700px;
  height: 100vh;
  margin: 0 auto;
  padding: 32px 28px 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#writeView, #homeView {
  display: flex;
  flex-direction: column;
  min-height: 0;
  flex: 1;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
  flex: 0 0 auto;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.brand {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 600;
  font-size: 16px;
  letter-spacing: -0.01em;
  cursor: pointer;
  color: var(--ink);
  background: none;
  border: none;
  padding: 0;
}

.brand:hover { color: var(--accent); }

.streak-chip {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: 6px;
}

.streak-chip .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--flame);
}

.write-cta {
  font-family: 'Public Sans', sans-serif;
  font-weight: 600;
  font-size: 13px;
  border: 1px solid var(--paper-line);
  background: var(--paper);
  color: var(--ink);
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
}

.write-cta:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- write view ---------- */

.entry-date-row {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin: 0 0 20px;
  flex: 0 0 auto;
}

.entry-date {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 500;
  font-size: 32px;
  letter-spacing: -0.01em;
  margin: 0;
  text-wrap: balance;
}

.entry-star {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  font-size: 24px;
  line-height: 1;
  color: var(--paper-line);
}

.entry-star[data-starred="true"] { color: var(--flame); }
.entry-star:not(:disabled):hover { color: var(--flame); }
.entry-star:disabled { opacity: 0.3; cursor: default; }

.month-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 13px;
  color: var(--ink-soft);
  flex: 0 0 auto;
}

.month-nav button {
  background: none;
  border: none;
  color: var(--ink-faint);
  cursor: pointer;
  font-size: 14px;
  padding: 2px 4px;
  line-height: 1;
}

.month-nav button:disabled { opacity: 0.35; cursor: default; }
.month-nav button:not(:disabled):hover { color: var(--accent); }

.month-nav .month-label {
  font-weight: 600;
  color: var(--ink);
}

.month-nav .month-count {
  margin-left: auto;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  color: var(--ink-faint);
}

.month-strip {
  display: grid;
  grid-template-columns: repeat(14, 1fr);
  gap: 5px;
  margin-bottom: 28px;
  flex: 0 0 auto;
}

.month-strip .day {
  aspect-ratio: 1;
  border: 1px solid var(--paper-line);
  border-radius: 4px;
  background: var(--paper);
  cursor: default;
  position: relative;
}

.month-strip .day[data-logged="true"] {
  background: var(--accent);
  border-color: var(--accent);
  cursor: pointer;
}

.month-strip .day[data-selected="true"] {
  outline: 1.5px solid var(--ink);
  outline-offset: 1.5px;
}

.month-strip .day[data-future="true"] {
  background: transparent;
  border-style: dashed;
  border-color: var(--paper-line);
}

.month-strip .day:hover::after {
  content: attr(data-tip);
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--paper);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  padding: 3px 6px;
  border-radius: 4px;
  white-space: nowrap;
  z-index: 5;
  pointer-events: none;
}

textarea#entryBox {
  display: block;
  width: 100%;
  flex: 1;
  min-height: 0;
  border: none;
  outline: none;
  resize: none;
  overflow-y: auto;
  background: transparent;
  color: var(--ink);
  font-family: 'Public Sans', sans-serif;
  font-size: 18px;
  line-height: 1.8;
  padding: 0;
}

textarea#entryBox::placeholder {
  color: var(--ink-faint);
}

.canvas-foot {
  flex: 0 0 auto;
  display: flex;
  justify-content: center;
  gap: 18px;
  padding: 12px 0 18px;
}

.canvas-foot span {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}

.canvas-foot .save-status.dirty { color: var(--flame); }

.tagline-foot {
  display: none;
}

/* ---------- home view ---------- */

.stat-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--paper-line);
  border: 1px solid var(--paper-line);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 28px;
  flex: 0 0 auto;
}

@media (max-width: 480px) {
  .stat-row { grid-template-columns: repeat(2, 1fr); }
}

.stat {
  background: var(--paper);
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.stat .num {
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  font-size: 26px;
  font-weight: 500;
  line-height: 1;
  display: flex;
  align-items: baseline;
  gap: 5px;
}

.stat.streak .num { color: var(--flame); }
.stat .num .unit { font-family: 'Public Sans', sans-serif; font-size: 12px; font-weight: 500; color: var(--ink-faint); }

.stat .label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-faint);
}

h1.home-title {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 500;
  font-size: 26px;
  margin: 0 0 24px;
  flex: 0 0 auto;
}

.section-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  margin: 0 0 10px;
  flex: 0 0 auto;
}

.sort-select {
  font-family: 'Public Sans', sans-serif;
  font-size: 11px;
  text-transform: none;
  letter-spacing: normal;
  color: var(--ink-soft);
  background: var(--paper);
  border: 1px solid var(--paper-line);
  border-radius: 6px;
  padding: 4px 8px;
  cursor: pointer;
}

.ledger-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding-bottom: 24px;
}

.ledger {
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--paper-line);
}

.ledger-item {
  display: grid;
  grid-template-columns: 22px 100px 1fr 60px;
  gap: 14px;
  padding: 15px 4px;
  border-bottom: 1px solid var(--paper-line);
  align-items: baseline;
  cursor: pointer;
}

.ledger-item:hover { background: var(--accent-soft); border-radius: 6px; }

.ledger-item .l-star {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  font-size: 15px;
  line-height: 1;
  color: var(--paper-line);
}

.ledger-item .l-star[data-starred="true"] { color: var(--flame); }
.ledger-item .l-star:hover { color: var(--flame); }

.ledger-item .l-date {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--ink-soft);
}

.ledger-item .l-preview {
  font-size: 14px;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ledger-item .l-words {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  color: var(--ink-faint);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.empty-ledger {
  color: var(--ink-faint);
  font-size: 13.5px;
  padding: 16px 4px;
}

.sync-note {
  font-size: 11px;
  color: var(--ink-faint);
  text-align: center;
  flex: 0 0 auto;
  padding: 6px 0 10px;
}

@media (max-width: 480px) {
  .ledger-item { grid-template-columns: 18px 76px 1fr 44px; gap: 10px; }
}

/* ---------- boot / login screens ---------- */

#bootScreen {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--ink-faint);
}

#loginScreen {
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  padding: 24px;
  text-align: center;
}

#loginScreen .login-brand {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 600;
  font-size: 26px;
}

#loginScreen .login-tagline {
  color: var(--ink-soft);
  font-size: 14.5px;
  max-width: 320px;
  margin: -16px 0 0;
}

.google-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Public Sans', sans-serif;
  font-weight: 600;
  font-size: 14px;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--paper-line);
  border-radius: 8px;
  padding: 11px 20px;
  cursor: pointer;
}

.google-btn:hover { border-color: var(--accent); }
.google-btn:disabled { opacity: 0.5; cursor: default; }

#loginError {
  color: var(--danger);
  font-size: 12.5px;
  max-width: 320px;
}

.account-chip {
  display: flex;
  align-items: center;
  gap: 8px;
}

.account-chip img {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: block;
}

.account-chip button {
  background: none;
  border: none;
  color: var(--ink-faint);
  font-family: 'Public Sans', sans-serif;
  font-size: 12px;
  cursor: pointer;
  padding: 0;
}

.account-chip button:hover { color: var(--danger); }
</style>
</head>
<body>

<div id="bootScreen">Loading…</div>

<div id="loginScreen" hidden>
  <div class="login-brand">500 Words Daily</div>
  <p class="login-tagline">One entry a day. Sign in to keep your own private streak.</p>
  <button class="google-btn" id="googleSignInBtn">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.9c1.7-1.56 2.7-3.87 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 009 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 013.68 9c0-.59.1-1.17.27-1.7V4.97H.98A9 9 0 000 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 00.98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
    Sign in with Google
  </button>
  <p id="loginError" hidden></p>
</div>

<div class="wrap" id="appWrap" hidden>

  <div class="topbar">
    <button class="brand" id="brandHome">500 Words Daily</button>
    <div class="topbar-right">
      <div class="streak-chip"><span class="dot"></span><span id="streakChip">0 day streak</span></div>
      <button class="write-cta" id="writeTodayBtn">Write today &rarr;</button>
      <div class="account-chip">
        <img id="userAvatar" src="" alt="" referrerpolicy="no-referrer" hidden>
        <button id="signOutBtn">Sign out</button>
      </div>
    </div>
  </div>

  <div id="writeView">

    <div class="entry-date-row">
      <h1 class="entry-date" id="entryDateHeading">&nbsp;</h1>
      <button class="entry-star" id="entryStarBtn" aria-label="Star this entry">☆</button>
    </div>

    <div class="month-nav">
      <button id="prevMonth" aria-label="Previous month">&#8249;</button>
      <span class="month-label" id="monthLabel"></span>
      <button id="nextMonth" aria-label="Next month">&#8250;</button>
      <span class="month-count" id="monthCount"></span>
    </div>
    <div class="month-strip" id="monthStrip"></div>

    <textarea id="entryBox" class="no-scrollbar" placeholder="Write something here…" spellcheck="true"></textarea>

    <div class="canvas-foot" id="canvasFoot">
      <span id="wordCount">0 words</span>
      <span class="save-status" id="saveStatus">saved</span>
    </div>
  </div>

  <div id="homeView" hidden>

    <h1 class="home-title">Entries</h1>

    <div class="stat-row">
      <div class="stat streak">
        <div class="num" id="statStreak">0<span class="unit">days</span></div>
        <div class="label">Current streak</div>
      </div>
      <div class="stat">
        <div class="num" id="statLongest">0<span class="unit">days</span></div>
        <div class="label">Longest streak</div>
      </div>
      <div class="stat">
        <div class="num" id="statTotal">0<span class="unit">entries</span></div>
        <div class="label">Total logged</div>
      </div>
      <div class="stat">
        <div class="num" id="statWords">0<span class="unit">words</span></div>
        <div class="label">Total written</div>
      </div>
    </div>

    <div class="section-label" style="display:flex; align-items:center; justify-content:space-between;">
      <span>All entries</span>
      <select id="sortSelect" class="sort-select">
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="words-desc">Most words</option>
        <option value="words-asc">Fewest words</option>
      </select>
    </div>
    <div class="ledger-scroll no-scrollbar">
      <div class="ledger" id="ledgerFull"></div>
    </div>
  </div>

  <div class="sync-note" id="syncNote"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<script>
(function () {
  var firebaseConfig = {
    apiKey: "AIzaSyCJgNoGWp2YbGHkNC2z_C3ZrH5IDelskmo",
    authDomain: "wordsdaily-ceb61.firebaseapp.com",
    projectId: "wordsdaily-ceb61",
    storageBucket: "wordsdaily-ceb61.firebasestorage.app",
    messagingSenderId: "82709653383",
    appId: "1:82709653383:web:97c4fcf14ed7c7cc2f9522"
  };
  var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
  var dateId = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var parseId = function (id) { return new Date(id + 'T00:00:00'); };
  var todayId = dateId(new Date());
  var dayMs = 86400000;

  var wordCount = function (text) {
    var t = (text || '').trim();
    if (!t) return 0;
    return t.split(/\s+/).filter(Boolean).length;
  };

  // ---- storage backend: one Firestore collection per signed-in account ----
  var store = { entries: {}, ready: false, save: function () {} };
  var unsubscribeEntries = null;

  function firebaseBackend(uid) {
    if (unsubscribeEntries) { unsubscribeEntries(); unsubscribeEntries = null; }
    var col = firebase.firestore().collection('users').doc(uid).collection('entries');
    document.getElementById('syncNote').textContent = 'Synced to your account.';
    unsubscribeEntries = col.orderBy('date', 'desc').limit(400).onSnapshot(function (snap) {
      var map = {};
      snap.docs.forEach(function (doc) {
        var data = doc.data();
        if (data && data.text) map[doc.id] = data;
      });
      store.entries = map;
      store.ready = true;
      renderCurrent();
    }, function (err) {
      document.getElementById('syncNote').textContent = 'Could not sync: ' + err.message;
    });
    store.save = function (id, entry) {
      return col.doc(id).set(entry);
    };
  }

  // ---- derived stats ----
  function computeStreaks(entries) {
    var has = function (id) { return !!(entries[id] && entries[id].text && entries[id].text.trim()); };
    var cursor = new Date();
    if (!has(todayId)) cursor = new Date(cursor.getTime() - dayMs);
    var current = 0;
    while (has(dateId(cursor))) {
      current++;
      cursor = new Date(cursor.getTime() - dayMs);
    }
    var ids = Object.keys(entries).filter(has).sort();
    var longest = 0, run = 0, prev = null, totalWords = 0;
    ids.forEach(function (id) {
      var d = parseId(id);
      if (prev && (d - prev) === dayMs) run++; else run = 1;
      longest = Math.max(longest, run);
      prev = d;
      totalWords += wordCount(entries[id].text);
    });
    return { current: current, longest: longest, total: ids.length, totalWords: totalWords };
  }

  // ---- view state ----
  var STRIP_DAYS = 14;
  var CONFETTI_GOAL = 500;
  var view = 'write';           // 'write' | 'home'
  var viewingDate = todayId;    // date currently shown in the write canvas
  var stripEnd = new Date();    // last day of the 14-day window currently shown
  var typing = false;
  var prevWordCount = 0;        // for detecting when this entry crosses the confetti goal

  function fireConfetti() {
    if (typeof confetti !== 'function') return;
    var end = Date.now() + 1800;
    (function frame() {
      confetti({ particleCount: 4, startVelocity: 35, spread: 80, ticks: 200, origin: { x: Math.random(), y: -0.1 } });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();
  }

  var el = {
    writeView: document.getElementById('writeView'),
    homeView: document.getElementById('homeView'),
    entryDateHeading: document.getElementById('entryDateHeading'),
    entryStarBtn: document.getElementById('entryStarBtn'),
    monthLabel: document.getElementById('monthLabel'),
    monthCount: document.getElementById('monthCount'),
    monthStrip: document.getElementById('monthStrip'),
    prevMonth: document.getElementById('prevMonth'),
    nextMonth: document.getElementById('nextMonth'),
    box: document.getElementById('entryBox'),
    wordCount: document.getElementById('wordCount'),
    saveStatus: document.getElementById('saveStatus'),
    streakChip: document.getElementById('streakChip'),
    statStreak: document.getElementById('statStreak'),
    statLongest: document.getElementById('statLongest'),
    statTotal: document.getElementById('statTotal'),
    statWords: document.getElementById('statWords'),
    ledgerFull: document.getElementById('ledgerFull'),
    canvasFoot: document.getElementById('canvasFoot'),
    bootScreen: document.getElementById('bootScreen'),
    loginScreen: document.getElementById('loginScreen'),
    appWrap: document.getElementById('appWrap'),
    googleSignInBtn: document.getElementById('googleSignInBtn'),
    loginError: document.getElementById('loginError'),
    userAvatar: document.getElementById('userAvatar'),
    signOutBtn: document.getElementById('signOutBtn'),
    sortSelect: document.getElementById('sortSelect')
  };

  el.sortSelect.addEventListener('change', function () {
    sortMode = el.sortSelect.value;
    renderLedger(store.entries);
  });

  function showView(next) {
    view = next;
    el.writeView.hidden = view !== 'write';
    el.homeView.hidden = view !== 'home';
  }

  function openDate(id) {
    viewingDate = id;
    stripEnd = parseId(id);
    showView('write');
    renderCurrent();
    setTimeout(function () { el.box.focus(); }, 0);
  }

  document.getElementById('brandHome').addEventListener('click', function () { showView('home'); renderCurrent(); });
  document.getElementById('writeTodayBtn').addEventListener('click', function () { openDate(todayId); });

  el.prevMonth.addEventListener('click', function () {
    stripEnd = new Date(stripEnd.getTime() - STRIP_DAYS * dayMs);
    renderMonthStrip(store.entries);
  });
  el.nextMonth.addEventListener('click', function () {
    var next = new Date(stripEnd.getTime() + STRIP_DAYS * dayMs);
    stripEnd = next > new Date() ? new Date() : next;
    renderMonthStrip(store.entries);
  });

  function renderMonthStrip(entries) {
    var now = new Date();
    var start = new Date(stripEnd.getTime() - (STRIP_DAYS - 1) * dayMs);
    el.monthLabel.textContent = start.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) +
      ' – ' + stripEnd.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    el.nextMonth.disabled = dateId(stripEnd) === dateId(now);

    el.monthStrip.innerHTML = '';
    var loggedCount = 0;
    for (var i = 0; i < STRIP_DAYS; i++) {
      var date = new Date(start.getTime() + i * dayMs);
      var id = dateId(date);
      var logged = !!(entries[id] && entries[id].text && entries[id].text.trim());
      var future = date > now;
      if (logged) loggedCount++;
      var cell = document.createElement('div');
      cell.className = 'day';
      cell.setAttribute('data-logged', logged ? 'true' : 'false');
      if (future) cell.setAttribute('data-future', 'true');
      if (id === viewingDate) cell.setAttribute('data-selected', 'true');
      cell.setAttribute('data-tip', date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + (logged ? ' — logged' : ''));
      if (logged) {
        cell.addEventListener('click', function (id) {
          return function () { openDate(id); };
        }(id));
      }
      el.monthStrip.appendChild(cell);
    }
    el.monthCount.textContent = loggedCount + (loggedCount === 1 ? ' day logged' : ' days logged');
  }

  var sortMode = 'date-desc';

  function sortIds(ids, entries, mode) {
    var cmp;
    if (mode === 'date-asc') cmp = function (a, b) { return a < b ? -1 : a > b ? 1 : 0; };
    else if (mode === 'words-desc') cmp = function (a, b) { return wordCount(entries[b].text) - wordCount(entries[a].text); };
    else if (mode === 'words-asc') cmp = function (a, b) { return wordCount(entries[a].text) - wordCount(entries[b].text); };
    else cmp = function (a, b) { return a < b ? 1 : a > b ? -1 : 0; }; // date-desc, default
    return ids.slice().sort(cmp);
  }

  function toggleStar(id) {
    var existing = store.entries[id];
    if (!existing) return;
    var updated = Object.assign({}, existing, { starred: !existing.starred });
    store.save(id, updated).then(function () {
      store.entries[id] = updated;
      renderCurrent();
    });
  }

  function renderLedger(entries) {
    el.ledgerFull.innerHTML = '';
    var allIds = Object.keys(entries).filter(function (id) { return entries[id].text && entries[id].text.trim(); });
    if (!allIds.length) {
      var empty = document.createElement('div');
      empty.className = 'empty-ledger';
      empty.textContent = 'No entries yet — write today’s and it’ll show up here.';
      el.ledgerFull.appendChild(empty);
      return;
    }
    var starredIds = sortIds(allIds.filter(function (id) { return entries[id].starred; }), entries, sortMode);
    var restIds = sortIds(allIds.filter(function (id) { return !entries[id].starred; }), entries, sortMode);
    var ids = starredIds.concat(restIds);
    ids.forEach(function (id) {
      var entry = entries[id];
      var row = document.createElement('div');
      row.className = 'ledger-item';
      var d = parseId(id);
      row.innerHTML =
        '<button class="l-star" data-starred="' + (entry.starred ? 'true' : 'false') + '" aria-label="Star this entry">' + (entry.starred ? '★' : '☆') + '</button>' +
        '<span class="l-date">' + d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: '2-digit' }) + '</span>' +
        '<span class="l-preview"></span>' +
        '<span class="l-words">' + wordCount(entry.text) + ' wd</span>';
      row.querySelector('.l-preview').textContent = entry.text;
      row.querySelector('.l-star').addEventListener('click', function (e) {
        e.stopPropagation();
        toggleStar(id);
      });
      row.addEventListener('click', function () { openDate(id); });
      el.ledgerFull.appendChild(row);
    });
  }

  function updateWordAndStatus() {
    el.wordCount.textContent = wordCount(el.box.value) + ' words';
  }

  function setSaveStatus(state) {
    el.saveStatus.classList.remove('dirty');
    if (state === 'dirty') { el.saveStatus.textContent = 'unsaved'; el.saveStatus.classList.add('dirty'); }
    else if (state === 'saving') { el.saveStatus.textContent = 'saving…'; }
    else { el.saveStatus.textContent = 'saved'; }
  }

  function renderCurrent() {
    var entries = store.entries;
    var streaks = computeStreaks(entries);
    el.streakChip.textContent = streaks.current + (streaks.current === 1 ? ' day streak' : ' day streak');
    el.statStreak.innerHTML = streaks.current + '<span class="unit">days</span>';
    el.statLongest.innerHTML = streaks.longest + '<span class="unit">days</span>';
    el.statTotal.innerHTML = streaks.total + '<span class="unit">entries</span>';
    el.statWords.innerHTML = streaks.totalWords.toLocaleString() + '<span class="unit">words</span>';

    if (view === 'home') {
      renderLedger(entries);
      return;
    }

    // write view
    var d = parseId(viewingDate);
    el.entryDateHeading.textContent = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }) + (viewingDate === todayId ? '' : '');
    var currentEntry = entries[viewingDate];
    var hasText = !!(currentEntry && currentEntry.text && currentEntry.text.trim());
    el.entryStarBtn.disabled = !hasText;
    el.entryStarBtn.setAttribute('data-starred', hasText && currentEntry.starred ? 'true' : 'false');
    el.entryStarBtn.textContent = hasText && currentEntry.starred ? '★' : '☆';
    el.entryStarBtn.title = hasText ? (currentEntry.starred ? 'Unstar this entry' : 'Star this entry') : 'Save an entry to star it';
    renderMonthStrip(entries);
    if (!typing) {
      el.box.value = (entries[viewingDate] && entries[viewingDate].text) || '';
      prevWordCount = wordCount(el.box.value);
    }
    updateWordAndStatus();
    setSaveStatus('saved');
  }

  var saveTimer = null;
  function scheduleSave() {
    setSaveStatus('dirty');
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 1200);
  }

  function doSave() {
    var text = el.box.value;
    var existing = store.entries[viewingDate] || {};
    if (!text.trim() && !existing.text) { setSaveStatus('saved'); return; }
    setSaveStatus('saving');
    var entry = Object.assign({}, existing, {
      date: viewingDate,
      text: text,
      wordCount: wordCount(text),
      createdAt: existing.createdAt || Date.now(),
      updatedAt: Date.now()
    });
    Promise.resolve(store.save(viewingDate, entry)).then(function () {
      store.entries[viewingDate] = entry;
      typing = false;
      setSaveStatus('saved');
      renderMonthStrip(store.entries);
    }).catch(function () {
      setSaveStatus('dirty');
    });
  }

  el.entryStarBtn.addEventListener('click', function () {
    if (!el.entryStarBtn.disabled) toggleStar(viewingDate);
  });

  el.box.addEventListener('input', function () {
    typing = true;
    var newCount = wordCount(el.box.value);
    if (prevWordCount < CONFETTI_GOAL && newCount >= CONFETTI_GOAL) fireConfetti();
    prevWordCount = newCount;
    updateWordAndStatus();
    scheduleSave();
  });

  el.box.addEventListener('blur', function () {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    doSave();
  });

  showView('write');
  renderCurrent();

  // ---- auth ----
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var provider = new firebase.auth.GoogleAuthProvider();

  function resetForSignOut() {
    if (unsubscribeEntries) { unsubscribeEntries(); unsubscribeEntries = null; }
    store.entries = {};
    store.save = function () {};
    viewingDate = todayId;
    stripEnd = new Date();
    showView('write');
    renderCurrent();
  }

  el.googleSignInBtn.addEventListener('click', function () {
    el.googleSignInBtn.disabled = true;
    el.loginError.hidden = true;
    auth.signInWithPopup(provider).catch(function (err) {
      el.loginError.textContent = 'Sign-in failed: ' + err.message;
      el.loginError.hidden = false;
    }).finally(function () {
      el.googleSignInBtn.disabled = false;
    });
  });

  function doSignOut() {
    auth.signOut();
  }
  el.signOutBtn.addEventListener('click', doSignOut);

  auth.onAuthStateChanged(function (user) {
    el.bootScreen.hidden = true;
    if (user) {
      el.loginScreen.hidden = true;
      el.appWrap.hidden = false;
      if (user.photoURL) {
        el.userAvatar.onerror = function () { el.userAvatar.hidden = true; };
        el.userAvatar.src = user.photoURL;
        el.userAvatar.hidden = false;
      } else {
        el.userAvatar.hidden = true;
      }
      showView('home');
      renderCurrent();
      firebaseBackend(user.uid);
    } else {
      resetForSignOut();
      el.appWrap.hidden = true;
      el.loginScreen.hidden = false;
    }
  });
})();
</script>
</body>
</html>
